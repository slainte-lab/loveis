<html lang="ru">
<head>

<title>Love is… Игра для пар</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Pangolin&display=swap" rel="stylesheet">

<style>
:root{--bg:#fff3e2;--pink:#f9c6c9;--peach:#ffd9b8;--mint:#c9ecd9;--mus:#f3c34b;--ink:#222;--red:#e0475b;--green:#2e9e6a;--card:#fffaf2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Pangolin','Comic Sans MS',sans-serif;font-size:18px;
 background-image:radial-gradient(#f0d9bd 1.2px,transparent 1.2px);background-size:22px 22px;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.hand{font-family:'Marck Script','Pangolin',cursive;font-weight:400;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 90px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:14px 16px;margin:12px 0;box-shadow:4px 4px 0 var(--ink)}
.card.pink{background:var(--pink)}.card.mint{background:var(--mint)}.card.peach{background:var(--peach)}.card.mus{background:var(--mus)}
.logo{font-family:'Marck Script';font-size:44px;line-height:1;text-align:center;margin:8px 0 4px}
.logo b{color:var(--red);font-weight:400}
.sub{text-align:center;opacity:.75;margin-bottom:10px}
.btn{display:block;width:100%;border:3px solid var(--ink);border-radius:16px;background:var(--mus);padding:14px 16px;font-size:20px;box-shadow:3px 3px 0 var(--ink);margin:10px 0;text-align:center}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.pink{background:var(--pink)}.btn.mint{background:var(--mint)}.btn.white{background:#fff}.btn.red{background:#f7a3ad}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:16px;margin:4px 4px 4px 0}
input[type=text],input[type=tel],textarea{width:100%;border:3px solid var(--ink);border-radius:14px;padding:12px 14px;font:inherit;font-size:19px;background:#fff;outline:none}
textarea{resize:vertical;min-height:70px}
label{display:block;margin:10px 0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;border:3px solid var(--ink);border-radius:999px;padding:6px 14px;margin:4px 6px 4px 0;background:#fff;font-size:18px}
.chip.sel{background:var(--mus)}.chip.ok{background:var(--mint)}.chip.adm{border-style:dashed}
.chip.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.timer{font-family:'Marck Script';font-size:40px;text-align:center}
.timer.low{color:var(--red)}
.q{font-size:21px;margin:2px 0 8px}
.qn{font-family:'Marck Script';font-size:22px;color:var(--red)}
.dot{position:fixed;top:8px;right:10px;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:#bbb;z-index:9}
.dot.on{background:#4cd08a}
.stamp{display:inline-block;font-family:'Marck Script';font-size:64px;border:6px solid;border-radius:14px;padding:0 22px;transform:rotate(-8deg);animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
.stamp.yes{color:var(--green)}.stamp.almost{color:#c78a00}.stamp.no{color:var(--red)}
@keyframes stamp{0%{transform:scale(3) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
.center{text-align:center}
.big{font-size:22px}
.muted{opacity:.65}
.pair-h{font-family:'Marck Script';font-size:26px}
.verd{display:flex;gap:8px}.verd .btn{margin:6px 0;padding:14px 4px;font-size:19px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.hr{border-top:3px dashed var(--ink);opacity:.25;margin:12px 0}
.dots span{animation:bl 1.2s infinite;display:inline-block}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.15}50%{opacity:1}}
/* big screen */
.screen{padding:24px 40px 40px;max-width:1500px;margin:0 auto}
.screen .logo{font-size:64px}
.screen .card{box-shadow:6px 6px 0 var(--ink)}
.lob{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:start}
.qrbox{background:#fff;border:4px solid var(--ink);border-radius:20px;padding:16px;display:inline-block;box-shadow:6px 6px 0 var(--ink)}
.code{font-family:'Marck Script';font-size:80px;letter-spacing:8px;text-align:center}
.screen .chip{font-size:28px;padding:8px 22px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.pgrid .card{margin:0}
.pgrid .chip{font-size:26px;display:flex;justify-content:space-between;width:100%}
.stage{display:grid;grid-template-columns:1fr 300px;gap:28px}
.stage .qbig{font-size:44px;line-height:1.2}
.stage .abig{font-size:52px;line-height:1.15;font-family:'Marck Script'}
.sb .row2{display:flex;justify-content:space-between;font-size:22px;padding:4px 0}
.bar{height:12px;border:2px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden;margin-bottom:6px}.bar i{display:block;height:100%;background:var(--pink)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:18px;height:360px;margin:20px 0}
.pod{width:230px;border:4px solid var(--ink);border-radius:18px 18px 0 0;text-align:center;padding:10px;box-shadow:5px 5px 0 var(--ink);animation:rise 1s ease backwards}
.pod .pl{font-size:58px}.pod .pn{font-family:'Marck Script';font-size:32px}
.pod.p1{height:100%;background:var(--mus)}.pod.p2{height:75%;background:var(--pink);animation-delay:.5s}.pod.p3{height:55%;background:var(--mint);animation-delay:.2s}
@keyframes rise{from{transform:translateY(120%)}to{transform:none}}
.noms{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.noms .card{margin:0}
.loveis{font-family:'Marck Script';font-size:26px;color:var(--red)}
.gear{position:fixed;right:14px;bottom:14px;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:22px;z-index:20;opacity:.5}
.gear:hover{opacity:1}
.ovl{position:fixed;right:14px;bottom:68px;width:420px;max-width:calc(100vw - 28px);max-height:75vh;overflow:auto;z-index:20}
.heart{color:var(--red)}
@media(max-width:800px){.screen{padding:14px}.lob,.stage{grid-template-columns:1fr}.podium{height:300px}.pod{width:30%}}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.em{position:absolute;bottom:-60px;font-size:56px;text-align:center;animation:floaty 4s ease-out forwards}
.em small{display:block;font-size:15px;font-family:'Pangolin'}
@keyframes floaty{0%{transform:translateY(0) scale(.6);opacity:0}10%{opacity:1;transform:translateY(-8vh) scale(1)}100%{transform:translateY(-95vh) translateX(var(--dx)) scale(1.2);opacity:0}}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:45}
#rib{position:fixed;left:0;right:0;bottom:0;display:none;gap:12px;padding:10px 20px;background:var(--card);border-top:4px solid var(--ink);z-index:30;justify-content:center;flex-wrap:wrap}
.rchip{position:relative;display:flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:999px;padding:4px 16px;background:#fff;font-size:24px}
.rchip .rp{font-size:28px;color:var(--red)}
.rchip .rd{position:absolute;right:-6px;top:-24px;font-family:'Marck Script';font-size:32px;opacity:0}
.rchip.bump{background:var(--mint);animation:bumpa .8s}
.rchip.down{background:#f7a3ad;animation:bumpa .8s}
.rchip.bump .rd,.rchip.down .rd{animation:rdel 1.6s forwards}
@keyframes bumpa{0%{transform:scale(1)}30%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes rdel{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
#rx{position:fixed;left:0;right:0;bottom:0;display:none;gap:6px;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(255,243,226,.96);border-top:3px solid var(--ink);z-index:30}
#rx button{font-size:30px;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:2px 10px;touch-action:manipulation}
#rx button:active{transform:scale(.85);background:var(--pink)}
.shake{animation:shk .5s}
@keyframes shk{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(6px)}}
.btn.on{background:var(--mus);box-shadow:0 0 0 4px #fff,0 0 0 7px var(--red),3px 3px 0 var(--ink)}
.jkb{display:inline-block;background:var(--mus);border:3px solid var(--ink);border-radius:999px;padding:4px 18px;font-family:'Marck Script';font-size:28px;transform:rotate(-2deg);animation:pop .4s}
.duelq{font-family:'Marck Script';font-size:48px;text-align:center;line-height:1.2;margin:16px 0}
.vs{display:flex;align-items:flex-end;justify-content:center;gap:30px;margin:10px 0}
.vsx{font-family:'Marck Script';font-size:48px;align-self:center;color:var(--red)}
.vsc{position:relative;min-width:260px;text-align:center;border:4px solid var(--ink);border-radius:20px;background:#fff;padding:18px 20px 12px;font-family:'Marck Script';font-size:44px;box-shadow:5px 5px 0 var(--ink)}
.vsc.win{background:var(--mus);transform:scale(1.08)}
.vbar{height:160px;border:3px solid var(--ink);border-radius:12px;background:#fff;margin:10px auto 6px;width:60px;display:flex;align-items:flex-end;overflow:hidden}
.vbar i{display:block;width:100%;background:var(--pink);transition:height 1s ease;min-height:2px}
.vn{font-family:'Pangolin';font-size:28px}
.screen{padding-bottom:130px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.duo .card{margin:8px 0}
.abig2{font-size:40px;line-height:1.15;font-family:'Marck Script'}
.stamp.sm{font-size:44px;border-width:4px;padding:0 14px}
@media(max-width:800px){.duo{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="dot" id="dot"></div>
<div style="position:fixed;left:8px;bottom:4px;font-size:11px;opacity:.4;z-index:9">v14 · связь: <span id="ver">…</span></div>
<div id="main"></div>
<div id="adm"></div>
<div id="rx"></div>
<div id="rib"></div>
<div id="fx"></div>
<canvas id="cf"></canvas>
<script>
'use strict';
/* ====================== НАСТРОЙКИ ====================== */
const QS=[
 'Какое блюдо ты закажешь на «последний ужин» в жизни?',
 'Какой фильм или сериал ты можешь пересматривать бесконечно?',
 'Как звали твоего домашнего питомца в детстве? (если не было, какого хотелось завести?)',
 'Кем бы ты работал, если бы деньги не были проблемой?',
 'В какую страну ты полетишь завтра, если билет бесплатный?'
];
const ANSWER_SEC=300, GUESS_ITEM_SEC=40, DUEL_SEC=20;
const BONUS_QS=['Кто чаще опаздывает?','Кто лучше готовит?','Кто первым мирится после ссоры?','Кто больше любит тратить деньги?','Кто громче храпит?','Кто романтичнее?','Кто лучше водит машину?','Кто дольше собирается?','Кто чаще говорит «я же говорил(а)»?','Кто громче смеётся?'];
const REACTS=['❤️','😂','👏','😱','🔥','😍'];
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
const NS='loveis-pg1';
const FIREBASE_URL=(new URLSearchParams(location.search).get('fb')||'https://slainte-33638-default-rtdb.europe-west1.firebasedatabase.app').replace(/\/$/,'');   // https://<проект>-default-rtdb.<регион>.firebasedatabase.app
const PTS={yes:1,almost:.5,no:0};
const STAMP={yes:'ВЕРНО!',almost:'ПОЧТИ!',no:'НЕТ!'};

/* ====================== УТИЛИТЫ ====================== */
const params=new URLSearchParams(location.search);
const U=params.get('u')||'';            // суффикс для тестов в одном браузере
const LS={get(k,d){try{const v=localStorage.getItem('lv'+U+'_'+k);return v==null?d:v}catch{return d}},
          set(k,v){try{localStorage.setItem('lv'+U+'_'+k,v)}catch{}}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=n=>Math.floor(Math.random()*n);
const genCode=()=>Array.from({length:4},()=>'ABCDEFGHJKMNPQRSTUVWXZ'[rnd(22)]).join('');
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const fmtP=n=>String(n).replace('.',',');
const fmtT=s=>{s=Math.max(0,s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const heart='<span class="heart">♥</span>';

/* ====================== СЕТЬ (MQTT через публичный брокер) ====================== */
let base='', netH=null, offset=0, isHost=false;
const links=[];   // подключения ко всем брокерам сразу
function connectAll(){
  (params.get('nomqtt')?[]:BROKERS).forEach(url=>{
    const rec={url,ok:false,up:0,err:'',n:0};
    links.push(rec);
    const c=rec.c=mqtt.connect(url,{clientId:'lv_'+Math.random().toString(16).slice(2,10),reconnectPeriod:2000,connectTimeout:8000,clean:true});
    c.on('connect',()=>{rec.ok=true;rec.up++;setDot();netH.onConnect(rec)});
    c.on('error',e=>{rec.err=String(e&&e.message||e).slice(0,60)});
    c.on('close',()=>{rec.ok=false;setDot();if(!S)render()});
    rec.sub=t=>c.subscribe(base+'/'+t,{qos:1});
    rec.pub=(t,m,o)=>c.publish(base+'/'+t,m,o);
    c.on('message',(t,p,pk)=>{rec.n++;try{netH.onMessage(JSON.parse(p.toString()),pk.retain)}catch(e){console.warn(e)}});
  });
  if(FIREBASE_URL)connectFb();
}
function connectFb(){
  const rec={url:FIREBASE_URL,name:'firebase',ok:false,up:0,err:'',n:0,es:{}};
  links.push(rec);
  const u=t=>FIREBASE_URL+'/'+base+'/'+t+'.json';
  rec.pub=(t,m)=>fetch(u(t),{method:t==='state'?'PUT':'POST',body:m}).catch(e=>{rec.err=String(e&&e.message||e).slice(0,50)});
  rec.sub=t=>{
    if(rec.es[t])return;
    const es=rec.es[t]=new EventSource(u(t));let first=true;
    es.onopen=()=>{rec.ok=true;rec.up++;setDot();netH.onConnect(rec)};
    es.onerror=()=>{rec.ok=false;rec.err='нет потока';setDot();if(!S)render()};
    es.addEventListener('put',ev=>{
      let d;try{d=JSON.parse(ev.data)}catch{return}
      if(!d||d.data==null)return;rec.err='';
      const items=t==='up'&&d.path==='/'?Object.values(d.data):[d.data];
      for(const m of items){rec.n++;try{netH.onMessage(m,first)}catch(e){console.warn(e)}}
      first=false;
    });
  };
  rec.sub(isHost?'up':'state');
}
const anyOk=()=>links.some(l=>l.ok);
const diagH=()=>'<div class="muted" style="font-size:13px;margin-top:10px;text-align:left">'+links.map(l=>(l.ok?'✓ ':'✗ ')+(l.name||l.url.split('//')[1].split(':')[0])+' · входов '+l.up+' · сообщений '+l.n+(l.err?' · '+esc(l.err):'')).join('<br>')+'</div>';
function setDot(){$('#dot').classList.toggle('on',anyOk());$('#ver').textContent=links.filter(l=>l.ok).length+'/'+links.length}
function pubAll(t,o,opt){const m=JSON.stringify(o);links.forEach(l=>l.ok&&l.pub(t,m,opt))}
const pubRet=(t,o)=>pubAll(t,o,{qos:1,retain:true});

/* ====================== ХОСТ (большой экран, хранит всю правду) ====================== */
let H=null, S=null, T=null;
function newHost(){
  return {code:genCode(),pin:String(1000+rnd(9000)),phase:'lobby',v:0,players:{},order:[],pairs:[],A:{},G:{},
          deadline:0,seq:[],verd:[],rvi:0,step:0,res:null,qs:QS,kicked:{},jki:[],jkUsed:{},bonus:{},dseq:[],dq:0,dstep:0,dvotes:{},dres:null};
}
function pairOfH(pid){return H.pairs.find(p=>p.a===pid||p.b===pid)}
function partnerH(pid){const p=pairOfH(pid);return p&&(p.a===pid?p.b:p.a)}
function ptsOf(i,side,v){
  if(!v)return 0;
  if(((H.jki[i])||{})[side])return v==='yes'?2:v==='almost'?1:-1;
  return PTS[v];
}
function scoresH(){
  const sc={};H.pairs.forEach(p=>sc[p.id]=H.bonus[p.id]||0);
  H.verd.forEach((V,i)=>{if(V&&H.seq[i])for(const k of ['a','b'])if(V[k])sc[H.seq[i].pr]+=ptsOf(i,k,V[k])});
  return sc;
}
function pub(){
  const pl={};
  for(const id of H.order){const p=H.players[id];pl[id]={n:p.n,d:!!p.d,adm:!!p.adm,jk:!!(H.jkUsed||{})[id]}}
  const sc=scoresH();
  const st={v:H.v,code:H.code,phase:H.phase,now:Date.now(),deadline:H.deadline,players:pl,order:H.order,pairs:H.pairs,qs:H.qs,kicked:Object.keys(H.kicked||{}),
    sc:H.pairs.map(p=>({id:p.id,n:p.n,pts:sc[p.id]})).sort((a,b)=>b.pts-a.pts)};
  if(H.phase==='duel'){
    const it=H.dseq[H.dq],pr=H.pairs.find(p=>p.id===it.pr);
    st.du={i:H.dq,total:H.dseq.length,q:it.q,step:H.dstep,pn:pr.n,ta:pr.a,tb:pr.b,an:H.players[pr.a].n,bn:H.players[pr.b].n,res:H.dstep===1?H.dres:null};
  }
  if(H.phase==='reveal'){
    const it=H.seq[H.rvi],pr=H.pairs.find(p=>p.id===it.pr),J=H.jki[H.rvi]||{},V=H.verd[H.rvi]||{};
    const side=(au,gu,k)=>({an:H.players[au].n,gn:H.players[gu].n,
      guess:H.step>=1?(H.G[gu]||[])[it.q]||'':null,
      ans:H.step>=2?(H.A[au]||[])[it.q]||'':null,
      v:V[k]||null,jk:H.step>=1?!!J[k]:false,pts:V[k]?ptsOf(H.rvi,k,V[k]):null});
    st.rv={i:H.rvi,total:H.seq.length,step:H.step,q:it.q,qt:H.qs[it.q],pn:pr.n,ids:[pr.a,pr.b],
      sent:[!!H.players[pr.a].d,!!H.players[pr.b].d],s:[side(pr.a,pr.b,'a'),side(pr.b,pr.a,'b')]};
  }
  if(H.phase==='results')st.res=H.res;
  return st;
}
function commit(){
  H.v++;LS.set('host',JSON.stringify(H));
  S=pub();pubRet('state',S);render();
}
function clearT(){clearTimeout(T);T=null}
function setPhase(p){
  clearT();H.phase=p;
  for(const id of H.order)H.players[id].d=false;
  if(p==='answer'){
    H.deadline=Date.now()+ANSWER_SEC*1000;
    for(const id of H.order)if(!H.A[id])H.A[id]=H.qs.map(()=>'');
  }
  if(p==='reveal'){
    H.seq=[];H.verd=[];H.G={};H.jki=[];H.jkUsed={};H.bonus={};H.rvi=0;H.step=0;H.deadline=Date.now()+GUESS_ITEM_SEC*1000;
    for(const pr of shuffle(H.pairs.slice()))
      for(let q=0;q<H.qs.length;q++)H.seq.push({pr:pr.id,q});
  }
  if(p==='duel'){
    const qs=shuffle(BONUS_QS.slice());
    H.dseq=shuffle(H.pairs.slice()).map((pr,i)=>({pr:pr.id,q:qs[i%qs.length]}));
    H.dq=0;duelInit();
  }
  if(p==='results')H.res=calcRes();
  commit();
  if(p==='reveal')revSched();
  if(p==='duel')duelSched();
}
function calcRes(){
  const sc=scoresH(),gp={},ap={};
  H.order.forEach(id=>{gp[id]=0;ap[id]=0});
  H.verd.forEach((V,i)=>{
    const it=H.seq[i],pr=it&&H.pairs.find(x=>x.id===it.pr);if(!pr||!V)return;
    for(const [k,au,gu] of [['a',pr.a,pr.b],['b',pr.b,pr.a]])if(V[k]){gp[gu]+=ptsOf(i,k,V[k]);ap[au]+=PTS[V[k]]}
  });
  const max=H.qs.length*2+2;
  const board=H.pairs.map(p=>({id:p.id,n:p.n,pts:sc[p.id],max,pct:max?sc[p.id]/max:0})).sort((a,b)=>b.pts-a.pts);
  const pick=(o,dir)=>{const ids=H.order.slice().sort((x,y)=>dir*(o[y]-o[x]));return ids.length?{n:H.players[ids[0]].n,v:o[ids[0]]}:null};
  const noms=[
    {t:'Телепат вечера',i:'🔮',d:'Лучше всех угадывал(а) партнёра',w:pick(gp,1),u:'б.'},
    {t:'Мимо кассы',i:'🎯',d:'Меньше всех попал(а) в ответы',w:pick(gp,-1),u:'б.'},
    {t:'Человек-загадка',i:'🕵️',d:'Его(её) ответы угадывали хуже всех',w:pick(ap,-1),u:'б.'}
  ];
  return {board,noms};
}
/* --- шаги показа --- */
function revSched(){
  clearT();
  if(H.phase!=='reveal')return;
  if(H.step===0)T=setTimeout(()=>revStep(1),Math.max(1000,H.deadline-Date.now()));
  else if(H.step===1)T=setTimeout(()=>revStep(2),3500);
  else if(H.step===3)T=setTimeout(revNext,3500);
}
function revStep(s){H.step=s;commit();revSched()}
function revNext(){
  if(H.rvi+1>=H.seq.length)return setPhase(BONUS_QS.length&&H.pairs.length>1?'duel':'results');
  H.rvi++;H.step=0;H.deadline=Date.now()+GUESS_ITEM_SEC*1000;
  for(const id of H.order)H.players[id].d=false;
  commit();revSched();
}
function setVerdict(side,v){
  if(H.phase!=='reveal'||H.step!==2||(side!=='a'&&side!=='b')||!(v in PTS))return;
  const V=H.verd[H.rvi]=H.verd[H.rvi]||{};
  if(V[side])return;
  V[side]=v;
  if(V.a&&V.b)H.step=3;
  commit();revSched();
}
/* --- бонус-раунд «Кто сильнее?»: остальные пары голосуют про одну пару, без очков --- */
function duelInit(){
  const pr=H.pairs.find(p=>p.id===H.dseq[H.dq].pr);
  H.dstep=0;H.dvotes={};H.dres=null;H.deadline=Date.now()+DUEL_SEC*1000;
  for(const id of H.order)H.players[id].d=(id===pr.a||id===pr.b);
}
function duelSched(){
  clearT();
  if(H.phase!=='duel')return;
  if(H.dstep===0)T=setTimeout(duelResult,Math.max(1000,H.deadline-Date.now()));
  else T=setTimeout(duelNext,8000);
}
function duelResult(){
  if(H.phase!=='duel'||H.dstep!==0)return;
  let ca=0,cb=0;
  for(const v of Object.values(H.dvotes)){if(v==='a')ca++;else if(v==='b')cb++}
  H.dres={ca,cb,tot:ca+cb,win:ca>cb?'a':cb>ca?'b':ca?'tie':'none'};
  H.dstep=1;commit();duelSched();
}
function duelNext(){
  if(H.phase!=='duel')return;
  if(H.dq+1>=H.dseq.length)return setPhase('results');
  H.dq++;duelInit();commit();duelSched();
}
function checkAdvance(){
  if(H.phase!=='answer')return;
  const all=H.order.length&&H.order.every(id=>H.players[id].d);
  if(all||Date.now()>H.deadline+1500)setPhase('reveal');
}
/* --- входящие сообщения --- */
const cleanName=n=>String(n||'').trim().slice(0,20)||'Гость';
function hostIn(m){
  if(!H||!m||typeof m.pid!=='string')return;
  const id=m.pid,p=H.players[id];
  switch(m.t){
    case 'join':
      if(H.kicked&&H.kicked[id])return;
      if(!p){if(H.phase!=='lobby')return;H.players[id]={n:cleanName(m.n),d:false};H.order.push(id)}
      else if(H.phase==='lobby'&&m.n)p.n=cleanName(m.n);
      if(m.pin&&m.pin===H.pin)H.players[id].adm=true;
      commit();break;
    case 'hello':pubRet('state',S);break;
    case 'ready':
      if(!p||m.ph!==H.phase)return;
      if(Array.isArray(m.a))H.A[id]=H.qs.map((_,i)=>String(m.a[i]||'').slice(0,300));
      if(typeof m.val==='boolean'){p.d=m.val;commit();checkAdvance()}
      break;
    case 'guess':{
      const it=H.seq[H.rvi],pr=it&&H.pairs.find(x=>x.id===it.pr);
      if(p&&H.phase==='reveal'&&H.step===0&&m.i===H.rvi&&pr&&(id===pr.a||id===pr.b)&&!p.d){
        (H.G[id]=H.G[id]||[])[it.q]=String(m.text||'').slice(0,300);
        p.d=true;
        H.jkUsed=H.jkUsed||{};
        if(m.jk&&!H.jkUsed[id]){H.jkUsed[id]=true;(H.jki[H.rvi]=H.jki[H.rvi]||{})[id===pr.b?'a':'b']=true}
        if(H.players[pr.a].d&&H.players[pr.b].d)revStep(1);else commit();
      }
      break}
    case 'vote':
      if(p&&H.phase==='duel'&&H.dstep===0&&m.i===H.dq&&(m.c==='a'||m.c==='b')&&!p.d){
        H.dvotes[id]=m.c;p.d=true;commit();
        if(H.order.every(x=>H.players[x].d))duelResult()}
      break;
    case 'react':{
      const now=Date.now();
      if(p&&REACTS.includes(m.e)&&now-(p.lr||0)>200){p.lr=now;fxEmoji(m.e,p.n)}
      break}
    case 'adm':
      if(p&&p.adm&&m.pin===H.pin)hostAdm(m);break;
  }
}
function hostAdm(m){
  const L=H.phase==='lobby';
  switch(m.op){
    case 'pair':{
      if(!L||m.a===m.b||!H.players[m.a]||!H.players[m.b]||pairOfH(m.a)||pairOfH(m.b))return;
      const n=cleanName(m.n&&m.n.trim()?m.n:H.players[m.a].n+' & '+H.players[m.b].n).slice(0,28);
      H.pairs.push({id:'p'+Date.now().toString(36)+rnd(99),n,a:m.a,b:m.b});commit();break}
    case 'unpair':if(!L)return;H.pairs=H.pairs.filter(p=>p.id!==m.id);commit();break;
    case 'kick':if(!L||!H.players[m.tp])return;
      H.pairs=H.pairs.filter(p=>p.a!==m.tp&&p.b!==m.tp);delete H.players[m.tp];
      H.order=H.order.filter(x=>x!==m.tp);(H.kicked=H.kicked||{})[m.tp]=true;commit();break;
    case 'start':
      if(L&&H.pairs.length&&H.order.every(pairOfH))setPhase('answer');break;
    case 'plus':
      if(H.phase==='answer'){H.deadline=Math.max(H.deadline,Date.now())+60000;commit()}
      else if(H.phase==='reveal'&&H.step===0){H.deadline+=15000;commit();revSched()}
      break;
    case 'force':if(H.phase==='answer')setPhase('reveal');break;
    case 'next':
      if(H.phase==='duel'){if(H.dstep===0)duelResult();else duelNext();break}
      if(H.phase!=='reveal')break;
      if(H.step<2)revStep(H.step+1);else if(H.step===3)revNext();break;
    case 'skipq':if(H.phase==='reveal')revNext();break;
    case 'verd':setVerdict(m.s,m.v);break;
    case 'again':
      if(H.phase==='results'){H.A={};H.G={};H.verd=[];H.seq=[];H.res=null;H.jki=[];H.jkUsed={};H.bonus={};setPhase('lobby')}break;
  }
}
function startHost(resume){
  isHost=true;
  if(resume){H=JSON.parse(LS.get('host'));if(H.phase==='guess'){H.phase='answer';H.deadline=0}H.jki=H.jki||[];H.jkUsed=H.jkUsed||{};H.bonus=H.bonus||{};H.dvotes=H.dvotes||{};H.dseq=H.dseq||[];H.dq=H.dq||0;H.dstep=H.dstep||0;if(H.phase==='duel'&&!H.dseq.length)H.phase='results'}else{H=newHost();}
  base=NS+'/'+H.code;

  };
  if(FIREBASE_URL)fetch(FIREBASE_URL+'/'+base+'/up.json',{method:'DELETE'}).catch(()=>{}).finally(connectAll);else connectAll();
  commit();
  if(H.phase==='reveal')revSched();

  setInterval(()=>{
    checkAdvance();

}

  if(!S){box.innerHTML='';return}
  if(isHost){
    box.innerHTML=`<button class="gear" data-a="gear">⚙</button>`+(admOpen?`<div class="card ovl">${admHTML()}</div>`:'');
    return;
  }
  const me=S.players[ME.pid];
  if(!me||!me.adm){box.innerHTML='';return}
  const open=admOpen===null?S.phase==='lobby':admOpen;
  box.innerHTML=`<div class="wrap" style="padding-top:0"><div class="card mus"><b data-a="admtoggle" style="cursor:pointer">⚙ Панель админа ${open?'▾':'▸'}</b>${open?'<div class="hr"></div>'+admHTML():''}</div></div>`;
}

/* ---------- большой экран ---------- */
function screenView(){
  const st=S,ph=st.phase,pn=id=>esc(st.players[id].n);
  const url=location.origin+location.pathname+'?r='+st.code+(U?'&u='+U:'')+(FIREBASE_URL?'&fb='+encodeURIComponent(FIREBASE_URL):'');
  if(ph==='lobby')return {key:'L'+st.v+'|'+url,html:`<div class="screen">${logoH}<div class="sub big">Заходи с телефона: отсканируй QR или введи код</div>
    <div class="lob"><div><div class="qrbox" id="qr"></div><div class="code">${st.code}</div>
    ${st.order.some(id=>st.players[id].adm)?'':`<div class="card mus center big" style="margin-top:14px">Ведущему: PIN <b style="font-size:34px;letter-spacing:4px">${esc(H.pin)}</b><div class="muted" style="font-size:15px">на телефоне: «я ведущий» → PIN</div></div>`}
    <div class="muted" style="font-size:13px;max-width:340px;word-break:break-all;margin-top:10px">${esc(url)}</div></div>
    <div><h2 style="font-size:40px">Уже в игре: ${st.order.length}</h2><div style="margin-top:10px">${st.order.map(id=>`<span class="chip pop ${st.players[id].adm?'adm':''}">${pn(id)}</span>`).join('')||'<span class="muted">ждём первых гостей…</span>'}</div>
    ${st.pairs.length?`<h2 style="font-size:34px;margin-top:24px">Пары</h2>`+st.pairs.map(p=>`<div class="card pink big" style="display:inline-block;margin:6px 12px 6px 0">${esc(p.n)}</div>`).join(''):''}</div></div></div>`,
    bind(){$('#qr').appendChild(qrFor(url))}};
  if(ph==='answer'){
    const t='Отвечаем про себя';
    const n=st.order.filter(id=>st.players[id].d).length;
    return {key:'A'+st.v+ph,html:`<div class="screen">${logoH}<h2 class="center" style="font-size:38px">${t}</h2>
     <div class="timer" style="font-size:96px">${timerH()}</div><div class="center big">Готовы: ${n} из ${st.order.length}</div>
     <div class="pgrid" style="margin-top:20px">${st.pairs.map(p=>`<div class="card ${p.a&&st.players[p.a].d&&st.players[p.b].d?'mint':''}"><div class="pair-h">${esc(p.n)}</div>
      ${[p.a,p.b].map(id=>`<div class="chip ${st.players[id].d?'ok':''}"><span>${pn(id)}</span><span>${st.players[id].d?'✓':'…'}</span></div>`).join('')}</div>`).join('')}</div></div>`};
  }
  if(ph==='reveal'){
    const rv=st.rv;
    return {key:'R'+st.v,html:`<div class="screen">${logoH}<div style="max-width:1300px;margin:0 auto">${revealHTML(rv,true)}</div></div>`};
  }
  if(ph==='duel'){
    const du=st.du,voters=st.order.filter(id=>id!==du.ta&&id!==du.tb);
    const head=`<h2 class="center" style="font-size:34px">⚔️ Кто сильнее? · ${du.i+1}/${du.total}</h2>
      <div class="center" style="margin-top:6px"><span class="chip adm" style="font-size:30px">${esc(du.pn)}</span></div>
      <div class="duelq">${esc(du.q)}</div>`;
    let body;
    if(du.step===0){
      const n=voters.filter(id=>st.players[id].d).length;
      body=`<div class="vs"><div class="vsc">${esc(du.an)}</div><div class="vsx">VS</div><div class="vsc">${esc(du.bn)}</div></div>
       <div class="timer" style="font-size:72px">${timerH()}</div>
       <div class="center big">Голосуют остальные: ${n} из ${voters.length}</div>
       <div class="center" style="margin-top:10px">${voters.map(id=>`<span class="chip ${st.players[id].d?'ok':''}">${pn(id)} ${st.players[id].d?'✓':'…'}</span>`).join('')}</div>`;
    }else{
      const r=du.res,pa=r.tot?Math.round(r.ca/r.tot*100):0,pb=r.tot?100-pa:0;
      const msg=r.win==='a'?`Друзья считают: <b>${esc(du.an)}</b> 👑`:r.win==='b'?`Друзья считают: <b>${esc(du.bn)}</b> 👑`:r.win==='tie'?'Мнения разделились поровну! 🤝':'Никто не проголосовал 🤷';
      body=`<div class="vs">
         <div class="vsc ${r.win==='a'?'win':''}">${esc(du.an)}<div class="vbar"><i style="height:${pa}%"></i></div><div class="vn">${r.ca} <span class="muted">· ${pa}%</span></div></div>
         <div class="vsx">VS</div>
         <div class="vsc ${r.win==='b'?'win':''}">${esc(du.bn)}<div class="vbar"><i style="height:${pb}%"></i></div><div class="vn">${r.cb} <span class="muted">· ${pb}%</span></div></div></div>
       <div class="center hand" style="font-size:44px;margin-top:10px">${msg}</div>
       <div class="center muted" style="margin-top:6px">Вот так вас видят друзья 😉</div>`;
    }
    return {key:'D'+st.v,html:`<div class="screen">${logoH}${head}${body}</div>`};
  }
  if(ph==='results'){
    const r=st.res,top=r.board.slice(0,3),cls=['p1','p2','p3'],ico=['🥇','🥈','🥉'];
    const order=top.length>=3?[1,0,2]:top.map((_,i)=>i);
    return {key:'F'+st.v,html:`<div class="screen">${logoH}<h2 class="center" style="font-size:42px">Итоги вечера</h2>
     <div class="podium">${order.map(i=>`<div class="pod ${cls[i]}"><div class="pl">${ico[i]}</div><div class="pn">${esc(top[i].n)}</div><div style="font-size:34px">${fmtP(top[i].pts)} <span class="muted" style="font-size:20px">из ${top[i].max}</span></div></div>`).join('')}</div>
     <div class="noms">${r.noms.filter(x=>x.w).map(x=>`<div class="card mus"><div style="font-size:40px">${x.i}</div><h3 style="font-size:30px">${x.t}</h3><div class="muted">${x.d}</div><div class="big"><b>${esc(x.w.n)}</b> — ${fmtP(x.w.v)} ${x.u}</div></div>`).join('')}</div>
     <div class="noms" style="margin-top:20px">${r.board.map((b,i)=>`<div class="card pink"><div class="loveis">${loveCap(b.pct)}</div><div class="big"><b>${i+1}. ${esc(b.n)}</b> · ${fmtP(b.pts)}/${b.max}</div></div>`).join('')}</div></div>`};
  }
}
function loveCap(p){
  return p>=.85?'Love is… читать мысли друг друга':p>=.6?'Love is… знать любимого человека почти наизусть':p>=.35?'Love is… каждый день открывать в человеке что-то новое':'Love is… любить вопреки неверным ответам';
}

/* ---------- телефон ---------- */
function playView(){
  const st=S,me=st.players[ME.pid],ph=st.phase;
  const wrap=h=>`<div class="wrap">${logoH}${h}</div>`;
  if(!me){
    if(S.kicked.includes(ME.pid))return {key:'kicked',html:wrap('<div class="card pink center"><h2>Тебя удалили из игры</h2><div class="muted">Если это ошибка, скажи ведущему.</div></div>')};
    if(ph!=='lobby')return {key:'late',html:wrap('<div class="card pink center">Игра уже идёт. Смотри на большой экран! '+heart+'</div>')};
    if(joined&&Date.now()-joinTried<4000)setTimeout(render,4200);
    if(joined&&LS.get('j_'+st.code)==='1'&&ME.name)return {key:'joining',html:wrap('<div class="sub">Заходим<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>')};
    return {key:'join',focus:'#nm',html:wrap(`<div class="card pink"><h2>Как тебя зовут?</h2>
      <input type="text" id="nm" maxlength="20" placeholder="Имя" value="${esc(ME.name)}" autocomplete="off">
      <details style="margin-top:12px"><summary class="muted">я ведущий</summary><label>PIN с большого экрана (⚙)</label><input type="tel" id="pin" maxlength="4" placeholder="1234" value="${esc(ME.pin)}"></details>
      <button class="btn" data-a="join">Войти в игру</button></div>`)};
  }
  const pr=pairOf(st,ME.pid),partner=pr&&st.players[pr.a===ME.pid?pr.b:pr.a];
  if(ph==='lobby')return {key:'l'+st.v+(pr?pr.id:''),html:wrap(`<div class="card mint center"><h2>Привет, ${esc(me.n)}!</h2>
    ${pr?`<div class="big">Твоя пара: <b>${esc(pr.n)}</b> ${heart}<br>Партнёр: ${esc(partner.n)}</div>`:'<div class="muted">Ждём, пока ведущий соберёт пары…</div>'}</div>
    <div class="card"><b>Уже в игре (${st.order.length}):</b><div>${st.order.map(id=>`<span class="chip">${esc(st.players[id].n)}</span>`).join('')}</div></div>`)};
  if(ph==='answer'){
    if(me.d){
      const n=st.order.filter(id=>st.players[id].d).length;
      return {key:'w'+st.v,html:wrap(`<div class="card mint center"><h2>Готово! ✓</h2><div class="timer">${timerH()}</div>
        <div>Готовы: ${n} из ${st.order.length}</div><div class="muted">Смотри на большой экран</div></div>
        <button class="btn white" data-a="edit">Изменить ответы</button>`)};
    }
    let draft=[];try{draft=JSON.parse(LS.get(draftKey(ph),'[]'))}catch{}
    return {key:'f'+ph+me.d,html:wrap(`<div class="card pink center"><div class="muted">Отвечай про себя. Партнёр потом будет угадывать!</div><div class="timer">${timerH()}</div></div>
      ${st.qs.map((q,i)=>`<div class="card"><div class="qn">${i+1}/${st.qs.length}</div><div class="q">${esc(q)}</div>
        <textarea data-i="${i}" maxlength="300" placeholder="Твой ответ…">${esc(draft[i]||'')}</textarea></div>`).join('')}
      <button class="btn" data-a="done">Готово ✓</button>`)};
  }
  if(ph==='reveal'){
    const rv=st.rv;
    if(jokerFor!==rv.i){jokerOn=false;jokerFor=rv.i}
    const myIdx=rv.ids.indexOf(ME.pid);
    if(rv.step===0&&myIdx>=0){
      const other=rv.s[myIdx?0:1].an;
      if(me.d||guessSent===rv.i)return {key:'gs'+rv.i,html:wrap('<div class="card mint center"><h2>Отправлено ✓</h2><div class="muted">Ждём партнёра, смотри на большой экран</div></div>')};
      return {key:'g'+rv.i,focus:'#gt',html:wrap(`<div class="card pink center"><div class="muted">Что ответит ${esc(other)}?</div><div class="timer">${timerH()}</div></div>
        <div class="card peach"><div class="qn">Вопрос ${rv.q+1}</div><div class="q">${esc(rv.qt)}</div></div>
        <textarea id="gt" maxlength="300" placeholder="Твоя догадка про ${esc(other)}…"></textarea>
        ${!me.jk?`<button class="btn white ${jokerOn?'on':''}" id="jk" data-a="jk">${jokerOn?'🃏 Двойная ставка включена! (нажми, чтобы отменить)':'🃏 Двойная ставка: верно +2, нет −1 (1 раз за игру)'}</button>`:''}
        <button class="btn" data-a="sendguess">Отправить ✓</button>`)};
    }
    const judge=me.adm&&rv.step===2&&rv.s.some(x=>!x.v);
    return {key:'r'+st.v,html:wrap(revealHTML(rv,false)+(judge?`<div class="card mus"><b>Оцени догадки:</b>${verdRows(rv)}</div>`:''))};
  }
  if(ph==='duel'){
    const du=st.du,target=ME.pid===du.ta||ME.pid===du.tb;
    if(target)return {key:'dt'+du.i+du.step,html:wrap(`<div class="card mus center"><h2>Это про вас! 😏</h2><div class="duelq" style="font-size:30px;margin:6px 0">${esc(du.q)}</div>
      <div class="muted">Остальные сейчас голосуют: кто из вас. Смотри на большой экран!</div></div>`)};
    if(!me.d&&du.step===0)return {key:'dv'+du.i,html:wrap(`<div class="card pink center"><h2>⚔️ Кто сильнее?</h2><div class="muted">Про пару «${esc(du.pn)}»</div><div class="timer">${timerH()}</div></div>
      <div class="card peach center"><div class="duelq" style="font-size:34px;margin:4px 0">${esc(du.q)}</div></div>
      <button class="btn mint" data-a="vote" data-c="a">${esc(du.an)}</button>
      <button class="btn pink" data-a="vote" data-c="b">${esc(du.bn)}</button>`)};
    return {key:'dw'+du.i+du.step+me.d,html:wrap('<div class="card mint center"><h2>'+(du.step===0?'Голос принят ✓':'Смотри на экран')+'</h2><div class="muted">Результат на большом экране</div></div>')};
  }
  if(ph==='results'){
    const r=st.res,i=r.board.findIndex(b=>pr&&b.id===pr.id),b=r.board[i];
    return {key:'x'+st.v,html:wrap(b?`<div class="card mus center"><h2>${i+1} место</h2><div class="big"><b>${esc(b.n)}</b><br>${fmtP(b.pts)} из ${b.max}</div></div>
      <div class="card pink center"><div class="loveis">${loveCap(b.pct)}</div></div>`:'<div class="card center">Спасибо за игру!</div>')};
  }
}

/* ====================== ЭФФЕКТЫ ====================== */
let rxOn=false;
function renderRx(){
  const on=!isHost&&S&&S.players&&S.players[ME.pid]&&['reveal','duel','results'].includes(S.phase);
  if(on===rxOn)return;
  rxOn=on;const b=$('#rx');
  b.style.display=on?'flex':'none';
  b.innerHTML=on?REACTS.map(e=>`<button data-a="react" data-e="${e}">${e}</button>`).join(''):'';
}
function fxEmoji(e,name){
  const layer=$('#fx');if(layer.children.length>60)return;
  const el=document.createElement('div');el.className='em';
  el.style.left=(5+Math.random()*85)+'%';el.style.setProperty('--dx',(Math.random()*160-80)+'px');
  el.innerHTML=e+'<small>'+esc(name)+'</small>';
  layer.appendChild(el);setTimeout(()=>el.remove(),4200);
}
const cf={ps:[],raf:0};
function confetti(n){
  const c=$('#cf'),W=c.width=innerWidth,Hh=c.height=innerHeight,ctx=c.getContext('2d');
  const cols=['#e0475b','#f3c34b','#f9c6c9','#c9ecd9','#ffd9b8','#2e9e6a'];
  for(let i=0;i<n;i++){
    const side=i%2;
    cf.ps.push({x:side?W:0,y:Hh*.9,vx:(side?-1:1)*(4+Math.random()*9),vy:-(9+Math.random()*13),
      r:Math.random()*6,vr:(Math.random()-.5)*.4,w:8+Math.random()*8,h:5+Math.random()*7,c:cols[rnd(cols.length)]});
  }
  if(cf.raf)return;
  const step=()=>{
    ctx.clearRect(0,0,W,Hh);
    cf.ps=cf.ps.filter(p=>p.y<Hh+30);
    for(const p of cf.ps){
      p.vy+=.35;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
    }
    if(cf.ps.length)cf.raf=requestAnimationFrame(step);else{cf.raf=0;ctx.clearRect(0,0,W,Hh)}
  };
  cf.raf=requestAnimationFrame(step);
}
function shake(){const m=$('#main');m.classList.add('shake');setTimeout(()=>m.classList.remove('shake'),600)}
let lastFx='';
function hostFx(){
  if(!isHost||!S)return;
  let key='';
  if(S.phase==='reveal'&&S.rv&&S.rv.step===3)key='v'+S.rv.i;
  else if(S.phase==='duel'&&S.du&&S.du.step===1)key='d'+S.du.i;
  else if(S.phase==='results')key='res';
  if(key===lastFx)return;
  lastFx=key;if(!key)return;
  if(key==='res'){confetti(220);setTimeout(()=>confetti(160),1600);setTimeout(()=>confetti(160),3400)}
  else if(key[0]==='v'){const vs=S.rv.s,yes=vs.filter(x=>x.v==='yes').length;
    if(vs.some(x=>x.v==='yes'&&x.jk))confetti(260);else if(yes)confetti(yes*70);else if(vs.some(x=>x.v==='almost'))confetti(45);else shake()}
  else if(S.du.res&&(S.du.res.win==='a'||S.du.res.win==='b'))confetti(70);
}
const ribEls={},ribPts={};
function renderRibbon(){
  const box=$('#rib');
  if(!isHost||!S||S.phase!=='reveal'){box.style.display='none';return}
  box.style.display='flex';
  (S.sc||[]).forEach((s,rank)=>{
    let el=ribEls[s.id];
    if(!el){el=ribEls[s.id]=document.createElement('div');el.className='rchip';
      el.innerHTML='<span class="cr"></span><span class="rn"></span><b class="rp"></b><span class="rj"></span><span class="rd"></span>';box.appendChild(el)}
    el.style.order=rank;
    el.querySelector('.cr').textContent=rank===0&&s.pts>0?'👑':'';
    el.querySelector('.rn').textContent=s.n;
    el.querySelector('.rp').textContent=fmtP(s.pts);
    const pr=S.pairs.find(p=>p.id===s.id);
    el.querySelector('.rj').textContent=pr?'🃏'.repeat((S.players[pr.a]&&!S.players[pr.a].jk?1:0)+(S.players[pr.b]&&!S.players[pr.b].jk?1:0)):'';
    const old=ribPts[s.id];
    if(old!=null&&s.pts!==old){
      const d=s.pts-old;el.querySelector('.rd').textContent=(d>0?'+':'−')+fmtP(Math.abs(d));
      el.classList.remove('bump','down');void el.offsetWidth;el.classList.add(d>0?'bump':'down');
    }
    ribPts[s.id]=s.pts;
  });
}

/* ====================== СТАРТ ====================== */
render();
if(params.get('r'))startPlay(params.get('r').toUpperCase());
</script>
